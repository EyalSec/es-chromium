# Dependabot keeps the pinned GitHub Actions (and, where this repository has
# them, its package dependencies) up to date. Updates arrive as pull requests
# once a week, grouped so there is one to review per ecosystem.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
